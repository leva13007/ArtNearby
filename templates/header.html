<div class="p-3">
    <div class="d-flex flex-row">
        <h1 class="m-0">Find your Product</h1>  
    </div>
        
    <div class="position-absolute top-0 end-0 mr-2 mt-4">
        {% if request.user.is_authenticated %}
            <span class="p-3">Hi, <a href="{% url 'profile' %}"> {{user.username}}</a></span>
            <img src="https://placehold.co/50"
                class="rounded-circle"
                width="50"
                height="50">

        {% else %}
            <span class="m-4">Hi, <a href="{% url 'register' %}">non authenticated user</a></span>
        {% endif %}
    </div>

</div>
<hr>
