{% extends 'base.html' %}

{% block content %}
<div class="container mt-3">
    <h2>List of products</h2>
    <form method="get" class="form-inline mb-3">
        {{ form.category.label_tag }}
        {{ form.category }}
        <button type="submit" class="btn btn-primary ml-2">Фільтрувати</button>
    </form>

    <ul>
        {% for product in products %}
        <li class="list-group-item d-flex justify-content-between row row-cols-2 row-cols-lg-5 g-2 g-lg-3 m-3">
            <div class="card opacity-70">
                <div class="card-body opacity-100">
                    <a href="{% url 'find_it:product-detail' product.pk %}" class="text-decoration-none mb-0 text-custom-custom-dark-blue">{{ product.name }}</a>
                    <span class="badge badge-primary text-custom-dark-blue">{{ product.category }}</span>
                </div>
            </div>
        </li>
        {% empty %}
        <li class="list-group-item">No products were find</li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
