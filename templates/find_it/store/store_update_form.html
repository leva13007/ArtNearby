{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h2>Update Store?</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Update</button>
        <a href="{% url 'find_it:store-management' %}" class="btn btn-secondary">Return to management page</a>
    </form>
</div>
{% endblock %}
